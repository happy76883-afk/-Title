<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>산업연관표 분석 웹앱</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>산업연관표(I-O) 분석 웹앱</h1>
      <p class="subtitle">로컬 기본부문 엑셀(.xlsx) 파일을 직접 불러와 분석합니다.</p>
    </header>

    <section class="panel">
      <h2>1. 기본부문 엑셀 불러오기</h2>
      <div class="controls">
        <label for="excelFileInput">기본부문 파일(.xlsx)</label>
        <input
          id="excelFileInput"
          type="file"
          accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
        />
        <button id="loadBtn" type="button">불러오기 및 검증</button>
      </div>
      <div id="status" class="status">대기 중 · .xlsx 파일을 선택해 주세요.</div>
      <div id="validation" class="validation"></div>
    </section>

    <section class="panel" id="analysisPanel">
      <h2>2. 분석 및 파급효과</h2>
      <div class="controls">
        <label for="sheetSelect">시트 선택</label>
        <select id="sheetSelect" disabled></select>

        <label for="sectorSelect">대상 부문 선택</label>
        <select id="sectorSelect" disabled></select>

        <label for="shockInput">공급/수요 충격(단위: 백만원 또는 비율)</label>
        <input id="shockInput" type="number" step="any" value="1000" disabled />

        <button id="runBtn" type="button" disabled>분석 실행</button>
      </div>
      <div id="result" class="result"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
