<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>과제물1: 산업연관표 분석 웹앱</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #f3f6fa;
      --card: #ffffff;
      --text: #18202c;
      --muted: #5c6878;
      --line: #dce3ec;
      --navy: #12457a;
      --teal: #115e67;
      --soft: #eef4fa;
      --ok: #157347;
      --err: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .topbar {
      background: var(--navy);
      color: #fff;
      padding: 14px 20px;
      font-weight: 700;
      font-size: 16px;
    }
    .container {
      max-width: 1120px;
      margin: 20px auto;
      padding: 0 16px 60px;
      display: grid;
      gap: 18px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .card-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .card-head h2, .card h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }
    .card-head h2 { margin-bottom: 0; }
    .desc {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
    }
    .btn {
      height: 38px;
      padding: 0 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: var(--navy);
    }
    .btn-teal { background: var(--teal); }
    .btn-sec { background: #475569; }
    .btn-sm {
      height: 32px;
      padding: 0 12px;
      font-size: 12.5px;
    }
    .btn:hover { opacity: 0.92; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .field input, .field select {
      width: 100%;
      height: 40px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }
    .hint {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 5px;
    }
    .unit-line {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .auto-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12.5px;
      margin-bottom: 14px;
      padding: 10px 12px;
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .ok { color: var(--ok); font-weight: 700; }
    .err { color: var(--err); font-weight: 700; }
    .basket {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fafbfd;
      margin-top: 12px;
    }
    .basket-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border-bottom: 1px dashed var(--line);
      font-size: 13.5px;
    }
    .basket-item:last-child { border-bottom: none; }
    .del-btn {
      background: #fee2e2;
      color: #991b1b;
      border: none;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .kpi {
      background: var(--soft);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .kpi .k-lbl { font-size: 12px; color: var(--muted); }
    .kpi .k-val { font-size: 18px; font-weight: 700; margin-top: 3px; }
    .table-wrap { overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
